name: Build HearLink Native Android
on:
  push:
    branches: [feature/unified-hearlink-modes]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hearlink-native-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
